# Type checking for the campaign tool and its tests: strict, on the oldest supported Python.
preset = "strict"
python-version = "3.9"
project-includes = ["scripts/campaign.py", "tests/*.py"]
search-path = ["tests"]

[errors]
# typing.override needs Python 3.12; the tool supports 3.9 without third-party packages.
missing-override-decorator = false
